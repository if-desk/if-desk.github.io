:root{--ink:#1E1E1E;--muted:#6E6E73;--blue:#1B91FF;--blue-d:#1673E0;--line:#E3E5EA;--tint:#F3F6FB}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:Gilroy,Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 64px}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:32px;min-height:28px}
.crumbs img{height:22px;width:auto;display:block}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--blue)}
.eb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
h1{font-size:32px;line-height:1.08;letter-spacing:-.02em;margin:0 0 20px;font-weight:700;text-wrap:balance}
.lead{font-size:17px;line-height:1.45;color:var(--muted);margin:0 0 32px;text-wrap:pretty}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:36px 0 12px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px 14px;background:#fff;cursor:pointer;font:inherit;text-align:left;color:var(--ink);min-height:64px;transition:border-color .15s,transform .05s}
.app:hover{border-color:var(--ink)}
.app:active{transform:scale(.99)}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.app b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.app small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;min-height:52px;width:100%}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.done{background:#1E9E5A;color:#fff}
.btn.ghost{background:var(--tint);color:var(--ink)}
.btn.ghost:hover{background:#E6ECF5}
details{border:1.5px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
.ptext{border:1.5px solid var(--blue);border-radius:16px;padding:18px 20px;margin:0 0 12px;word-wrap:break-word;font-size:15.5px;line-height:1.55;background:#fff}
.ptext.draft{color:var(--muted);border-style:dashed}
.ptext > *{margin:0 0 12px}
.ptext > :last-child{margin-bottom:0}
.ptext h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:20px 0 8px}
.ptext > h3:first-child{margin-top:0}
.ptext ul,.ptext ol{padding-left:22px}
.ptext li{margin:0 0 6px}
.ptext li > ul,.ptext li > ol{margin-top:6px}
.ptext li::marker{color:var(--muted)}
.ptext strong{font-weight:600}
.ptext em{font-style:italic}
.ptext hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.prep{background:var(--tint);border-radius:16px;padding:16px 20px;margin:0 0 4px}
.prep ul{margin:0;padding-left:20px}
.prep li{margin:0 0 4px}
.prep li::marker{color:var(--muted)}
.url{display:block;font-size:19px;font-weight:700;background:var(--tint);border-radius:14px;padding:14px 16px;margin:0 0 10px;word-break:break-all;color:var(--ink);text-decoration:none;text-align:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .btn{font-size:15px;min-height:52px;padding:12px 14px;text-align:center}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.badge{display:inline-block;font-size:12px;font-weight:600;background:var(--tint);color:var(--muted);border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}
.nav{display:flex;flex-direction:column;gap:8px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.nav a{display:flex;justify-content:space-between;align-items:center;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600;background:var(--tint);border-radius:12px;padding:12px 14px}
.nav a span{color:var(--muted);font-weight:400;font-size:13px}
.nav a.cur{opacity:.45;pointer-events:none}
.card{display:block;border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--ink)}
.card .eb{margin-bottom:4px}
.card h3{margin:0 0 6px;font-size:20px;line-height:1.15}
.card p{margin:0;font-size:15px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
textarea.sr{position:absolute;left:-9999px;top:0}
@media (max-width:380px){.apps,.row{grid-template-columns:1fr}}
</style>
</head>

<h1>Прототип и вопросы для теста<span class="badge">в работе</span></h1>
<p class="lead">Ассистент помогает описать прототип, составить сценарий теста и список вопросов для беседы после теста.</p>

<h2>Промпт</h2>
<div class="ptext draft" id="ptext"><p>Текст промпта появится здесь.</p></div>
<button class="btn primary" id="copy">Скопировать промпт</button>

<h2>Открыть в ассистенте</h2>

</div>

<h2>Сохранить себе</h2>
<div class="row">
  <button class="btn ghost" id="copylink">Скопировать ссылку на промпт</button>
  <a class="btn ghost" href="https://t.me/share/url?url=https://if-desk.github.io/mars-dm/3&amp;text=Промпт 3: Прототип и вопросы для теста" target="_blank" rel="noopener">Отправить себе в Telegram</a>
</div>
</div>
<div class="toast" id="toast"></div>
<textarea class="sr" id="clip" aria-hidden="true"></textarea>
<script>
const LINK="https://if-desk.github.io/mars-dm/3";const TITLE="Промпт 3: Прототип и вопросы для теста";const P="Текст промпта появится здесь.";
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){}const ta=$('#clip');ta.value=text;ta.select();ta.setSelectionRange(0,text.length);try{return document.execCommand('copy');}catch(e){return false;}}

document.querySelectorAll('.app').forEach(b=>b.addEventListener('click',async()=>{
  const url=b.dataset.url.replace('{q}',encodeURIComponent(P));
  if(b.dataset.prefill!=='1'){await copyText(P);toast('Промпт скопирован, вставьте его в чат');}
  window.open(url,'_blank','noopener');
}));
$('#copy').addEventListener('click',async()=>{const ok=await copyText(P);const b=$('#copy');b.textContent=ok?'Скопировано':'Выделите текст и скопируйте вручную';b.classList.toggle('done',ok);setTimeout(()=>{b.textContent='Скопировать промпт';b.classList.remove('done');},2000);});
$('#copylink').addEventListener('click',async()=>{toast((await copyText(LINK))?'Ссылка на промпт скопирована':'Не удалось скопировать');});
</script>
